<div style="display: flex; align-items: center; height: 100%">
  <div *ngFor="let star of stars; let i = index">
    <mat-icon
      class="star-container"
      (click)="changeRate(i)"
      (mouseenter)="onRate(i)"
      [ngStyle]="{ color: i <= selectedRate ? 'yellow' : 'black' }"
      >star</mat-icon
    >
  </div>
</div>
